name: Generate Release Keystore

# 只需运行一次：用于生成正式签名的密钥库
# 运行后在 Artifact 中下载 keystore-base64.txt，把内容填入仓库 Secret: ANDROID_KEYSTORE_BASE64
# 注意：密钥库一旦用于发布，务必备份，不要重新生成（否则无法覆盖安装旧版本）

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias (密钥别名)'
        required: true
        default: 'hasstools'
        type: string
      validityDays:
        description: 'Validity in days (有效期天数，建议 10000 以上)'
        required: true
        default: '10950'
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        id: gen
        env:
          ALIAS: ${{ inputs.alias }}
          VALIDITY: ${{ inputs.validityDays }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="release.keystore"
          STORE_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          KEY_PASS="$STORE_PASS"

          # 先生成密码并立刻注册掩码，再执行后续任何可能打印密码的操作
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity "$VALIDITY" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=HassTools, OU=Release, O=HassTools, L=Unknown, ST=Unknown, C=CN"

          base64 -w 0 "$KEYSTORE_FILE" > keystore-base64.txt
          echo "::add-mask::$(cat keystore-base64.txt)"

          {
            echo "===== 请复制以下 4 个值到仓库 Settings -> Secrets and variables -> Actions ====="
            echo ""
            echo "[1] ANDROID_KEYSTORE_BASE64"
            echo "----- 以下整行内容（很长，务必完整复制） -----"
            cat keystore-base64.txt
            echo ""
            echo "----- 以上为 ANDROID_KEYSTORE_BASE64 的值 -----"
            echo ""
            echo "[2] ANDROID_KEYSTORE_PASSWORD"
            echo "$STORE_PASS"
            echo ""
            echo "[3] ANDROID_KEY_ALIAS"
            echo "$ALIAS"
            echo ""
            echo "[4] ANDROID_KEY_ALIAS_PASSWORD"
            echo "$KEY_PASS"
            echo ""
            echo "====================================================================="
          } > keystore-info.txt

          echo "密钥库已生成，4 个 Secret 的值请从 Artifact 'keystore-secrets' 下载获取。"

      - name: Write secrets summary
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          {
            echo "## 密钥库已生成"
            echo ""
            echo "请在下方 Artifact 下载 \`keystore-secrets\`，里面包含全部 4 个 Secret 的值。"
            echo ""
            echo "| Secret 名称 | 说明 |"
            echo "|---|---|"
            echo "| \`ANDROID_KEYSTORE_BASE64\` | keystore-info.txt 中 [1] 段落的整行内容 |"
            echo "| \`ANDROID_KEYSTORE_PASSWORD\` | keystore-info.txt 中 [2] 段落 |"
            echo "| \`ANDROID_KEY_ALIAS\` | \`$ALIAS\` |"
            echo "| \`ANDROID_KEY_ALIAS_PASSWORD\` | keystore-info.txt 中 [4] 段落 |"
            echo ""
            echo "> 下载后请立即填入 Secret，并妥善离线备份密钥库与密码。"
            echo "> 拿到 Secret 后建议删除本次运行的 Artifact。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore secrets
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: |
            keystore-base64.txt
            keystore-info.txt
          retention-days: 1
          if-no-files-found: error
